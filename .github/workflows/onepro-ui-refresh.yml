name: One Pro UI Refresh

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/onepro-ui-refresh.yml

permissions:
  contents: write

jobs:
  apply-ui-refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch dashboard and agenda
        run: python scripts/onepro-ui-refresh.py

      - name: Install dependencies
        run: npm ci

      - name: Verify runtime
        run: npm run check:runtime

      - name: Build
        run: npm run build

      - name: Commit verified UI refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Prototype.tsx src/prototype.css AGENTS.md
          git diff --cached --quiet && exit 0
          git commit -m "Refresh One Pro dashboard and agenda UI"
          git push origin HEAD:main
