name: Upgrade Data Attendance Reports
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/upgrade-data-attendance-reports.yml
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/upgrade-data-attendance-reports.py
      - run: npm ci
      - run: npm run check:runtime
      - run: npm run build
      - name: Commit verified upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Prototype.tsx src/operations-workspace.css AGENTS.md
          git diff --cached --quiet && exit 0
          git commit -m "Upgrade class database attendance recap and reports"
          git push origin HEAD:main
