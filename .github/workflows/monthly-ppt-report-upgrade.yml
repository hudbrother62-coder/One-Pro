name: Monthly PPT Report Upgrade
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/monthly-ppt-report-upgrade.yml
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/upgrade-monthly-ppt-report.py
      - run: python scripts/fix-monthly-ppt-build.py
      - run: npm install pptxgenjs@4 jszip@3 --save
      - run: npm run check:runtime
      - run: npm run build
      - name: Commit verified monthly PPT report upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/Prototype.tsx src/operations-workspace.tsx src/word-report.tsx src/ppt-report.tsx src/ppt-report.css AGENTS.md
          git diff --cached --quiet && exit 0
          git commit -m "Add month-first Word and PPT reports"
          git push origin HEAD:main
# retry after PPT table compatibility fix
