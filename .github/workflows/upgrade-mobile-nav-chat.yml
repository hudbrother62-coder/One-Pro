name: Upgrade Mobile Nav and Chat
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/upgrade-mobile-nav-chat.yml
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/upgrade-mobile-nav-chat.py
      - run: python scripts/append-mobile-chat-css.py
      - run: python scripts/fix-chat-cx.py
      - run: npm ci
      - run: npm run check:runtime
      - run: npm run build
      - name: Commit verified mobile navigation and chat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Prototype.tsx src/prototype.css AGENTS.md
          git diff --cached --quiet && exit 0
          git commit -m "Polish journal, add mobile drawer, and direct organizational chat"
          git push origin HEAD:main
