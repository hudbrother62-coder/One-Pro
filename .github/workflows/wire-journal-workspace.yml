name: Wire Journal Workspace
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wire-journal-workspace.yml
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/wire-journal-workspace.py
      - run: npm ci
      - run: npm run check:runtime
      - run: npm run build
      - name: Commit verified journal workspace
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Prototype.tsx AGENTS.md
          git diff --cached --quiet && exit 0
          git commit -m "Differentiate journals and wire monthly AI analysis"
          git push origin HEAD:main
