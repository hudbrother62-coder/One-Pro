name: Professional Word Report Upgrade
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/word-report-upgrade.yml
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/apply-word-report.py
      - run: npm install docx@9 --save
      - run: npm run check:runtime
      - run: npm run build
      - name: Commit verified Word report upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/Prototype.tsx src/operations-workspace.tsx src/word-report.tsx src/word-report.css AGENTS.md
          git diff --cached --quiet && exit 0
          git commit -m "Add professional Word class reports"
          git push origin HEAD:main
