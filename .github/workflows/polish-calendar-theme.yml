name: Polish Calendar Theme
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/polish-calendar-theme.yml
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/polish-calendar-theme.py
      - run: npm ci
      - run: npm run check:runtime
      - run: npm run build
      - name: Commit verified calendar polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Prototype.tsx src/operations-workspace.css AGENTS.md
          git diff --cached --quiet && exit 0
          git commit -m "Polish agenda calendar and date controls"
          git push origin HEAD:main
