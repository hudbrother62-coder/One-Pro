<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">One Pro logo</title>
  <desc id="desc">Logo One Pro dengan simbol grafik progres berwarna teal mint dan tulisan One Pro.</desc>
  <defs>
    <linearGradient id="tileMint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B168F"/>
      <stop offset="0.34" stop-color="#5B146E"/>
      <stop offset="0.68" stop-color="#172A67"/>
      <stop offset="1" stop-color="#075797"/>
    </linearGradient>
    <linearGradient id="wordMint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4B075E"/>
      <stop offset="0.46" stop-color="#67147A"/>
      <stop offset="0.56" stop-color="#173B74"/>
      <stop offset="1" stop-color="#075797"/>
    </linearGradient>
    <clipPath id="tileClip">
      <rect x="320" y="130" width="560" height="560" rx="150"/>
    </clipPath>
  </defs>

  <rect width="1200" height="1200" fill="#FFFFFF"/>

  <rect x="320" y="130" width="560" height="560" rx="150" fill="url(#tileMint)"/>
  <g clip-path="url(#tileClip)" opacity="0.28">
    <path d="M320 130 L650 130 L440 430 Z" fill="#D529B8"/>
    <path d="M320 690 L320 385 L600 690 Z" fill="#21053D"/>
    <path d="M880 310 L880 690 L590 690 Z" fill="#0877C9"/>
  </g>

  <g fill="none" stroke="#FFFFFF" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
    <path d="M438 532 L548 410 L662 468 L775 293"/>
  </g>
  <circle cx="438" cy="532" r="34" fill="#FFFFFF"/>
  <circle cx="775" cy="293" r="34" fill="#FFFFFF"/>

  <text x="600" y="895" text-anchor="middle" fill="url(#wordMint)"
        font-family="Inter, Poppins, Arial, sans-serif" font-size="150" font-weight="700"
        letter-spacing="-7">One Pro</text>
</svg>
